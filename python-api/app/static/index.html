<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CobrarApp</title>
    <style>
      :root {
        --bg: #f6f8fb;
        --panel: #ffffff;
        --ink: #14213d;
        --muted: #607086;
        --line: #d9e1ea;
        --accent: #1f6feb;
        --accent-dark: #174ea6;
        --good: #087f5b;
        --warn: #9a6700;
        --bad: #c92a2a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .shell {
        width: min(1120px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .mark {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        background: var(--ink);
        color: white;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.1;
      }

      .subtitle {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 15px;
      }

      .status {
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 10px 12px;
        color: var(--muted);
        font-size: 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
        gap: 20px;
      }

      section {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 22px;
      }

      h2 {
        margin: 0 0 16px;
        font-size: 19px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
        font-size: 14px;
      }

      input[type="file"] {
        width: 100%;
        border: 1px dashed #a9b7c8;
        background: #fbfcfe;
        padding: 18px;
        color: var(--muted);
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      button {
        border: 0;
        background: var(--accent);
        color: white;
        min-height: 42px;
        padding: 0 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: #e8eef7;
        color: var(--ink);
      }

      button:hover {
        background: var(--accent-dark);
      }

      button.secondary:hover {
        background: #d9e4f3;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .preview {
        margin-top: 18px;
        border: 1px solid var(--line);
        min-height: 240px;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f9fbfd;
      }

      .preview img {
        width: 100%;
        height: 100%;
        max-height: 420px;
        object-fit: contain;
      }

      .empty {
        color: var(--muted);
      }

      .result {
        display: grid;
        gap: 12px;
      }

      .message {
        border: 1px solid var(--line);
        padding: 14px;
        color: var(--muted);
        line-height: 1.45;
      }

      .message.ok {
        border-color: #9ad9c2;
        color: var(--good);
        background: #f0fbf6;
      }

      .message.warn {
        border-color: #f0d48a;
        color: var(--warn);
        background: #fff9e8;
      }

      .message.bad {
        border-color: #f1a5a5;
        color: var(--bad);
        background: #fff5f5;
      }

      dl {
        display: grid;
        grid-template-columns: 130px 1fr;
        gap: 10px 12px;
        margin: 0;
      }

      dt {
        color: var(--muted);
        font-size: 13px;
      }

      dd {
        margin: 0;
        font-weight: 700;
      }

      pre {
        margin: 0;
        max-height: 260px;
        overflow: auto;
        background: #111827;
        color: #dbeafe;
        padding: 14px;
        font-size: 13px;
        line-height: 1.45;
      }

      .report {
        margin-top: 20px;
      }

      @media (max-width: 820px) {
        header,
        .grid {
          grid-template-columns: 1fr;
          display: grid;
        }

        header {
          align-items: start;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="brand">
          <div class="mark">C</div>
          <div>
            <h1>CobrarApp</h1>
            <p class="subtitle">Sube una captura Yape o Plin y activa el flujo de n8n desde el backend.</p>
          </div>
        </div>
        <div class="status" id="status">Backend listo</div>
      </header>

      <div class="grid">
        <section>
          <h2>Captura de pago</h2>
          <form id="payment-form">
            <label for="capture">Imagen</label>
            <input id="capture" name="data" type="file" accept="image/*" required />
            <div class="actions">
              <button id="submit" type="submit">Activar flujo</button>
              <button class="secondary" id="direct" type="button">Procesar directo</button>
              <button class="secondary" id="clear" type="button">Limpiar</button>
            </div>
          </form>
          <div class="preview" id="preview">
            <span class="empty">La vista previa aparecera aqui</span>
          </div>
        </section>

        <section class="result">
          <h2>Resultado</h2>
          <div class="message" id="message">Esperando una captura.</div>
          <dl>
            <dt>Estado</dt>
            <dd id="estado">-</dd>
            <dt>Pagador</dt>
            <dd id="nombre">-</dd>
            <dt>Monto</dt>
            <dd id="monto">-</dd>
            <dt>Tipo</dt>
            <dd id="tipo">-</dd>
            <dt>Operacion</dt>
            <dd id="operacion">-</dd>
          </dl>
          <pre id="raw">{}</pre>
          <div class="report">
            <div class="actions">
              <button class="secondary" id="report" type="button">Ver reporte</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script>
      const form = document.querySelector("#payment-form");
      const fileInput = document.querySelector("#capture");
      const submit = document.querySelector("#submit");
      const directButton = document.querySelector("#direct");
      const clearButton = document.querySelector("#clear");
      const reportButton = document.querySelector("#report");
      const preview = document.querySelector("#preview");
      const statusBox = document.querySelector("#status");
      const message = document.querySelector("#message");
      const raw = document.querySelector("#raw");
      const fields = {
        estado: document.querySelector("#estado"),
        nombre: document.querySelector("#nombre"),
        monto: document.querySelector("#monto"),
        tipo: document.querySelector("#tipo"),
        operacion: document.querySelector("#operacion"),
      };

      function setStatus(text) {
        statusBox.textContent = text;
      }

      function setMessage(text, type = "") {
        message.className = `message ${type}`;
        message.textContent = text;
      }

      function paintPayload(payload) {
        const pago = payload.pago || payload;
        const reporte = payload.reporte;
        fields.estado.textContent = payload.estado || pago.estado || "-";
        fields.nombre.textContent = pago.nombre || "-";
        fields.monto.textContent = pago.monto ? `S/. ${Number(pago.monto).toFixed(2)}` : "-";
        fields.tipo.textContent = pago.tipo || "-";
        fields.operacion.textContent = pago.operacion || "-";
        raw.textContent = JSON.stringify(payload, null, 2);

        if (payload.estado === "Registrado" || payload.ok === true) {
          const suffix = payload.modo === "directo-backend" ? " Modo directo: n8n no fue usado." : "";
          const reportText = reporte ? ` Reporte: ${reporte.cantidad_pagos} pagos, total S/. ${Number(reporte.total_recaudado || 0).toFixed(2)}.` : "";
          setMessage((payload.mensaje || "Pago registrado correctamente.") + reportText + suffix, "ok");
        } else if (payload.estado === "Duplicado") {
          const reportText = reporte ? ` Reporte: ${reporte.cantidad_pagos} pagos, total S/. ${Number(reporte.total_recaudado || 0).toFixed(2)}.` : "";
          setMessage((payload.mensaje || "Pago duplicado.") + reportText, "warn");
        } else {
          const reportText = reporte ? ` Reporte: ${reporte.cantidad_pagos} pagos, total S/. ${Number(reporte.total_recaudado || 0).toFixed(2)}.` : "";
          setMessage((payload.mensaje || "No se pudo procesar la captura.") + reportText, "bad");
        }
      }

      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        preview.innerHTML = `<img src="${url}" alt="Vista previa de captura" />`;
      });

      clearButton.addEventListener("click", () => {
        form.reset();
        preview.innerHTML = '<span class="empty">La vista previa aparecera aqui</span>';
        raw.textContent = "{}";
        Object.values(fields).forEach((node) => (node.textContent = "-"));
        setMessage("Esperando una captura.");
        setStatus("Backend listo");
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const file = fileInput.files[0];
        if (!file) {
          setMessage("Selecciona una captura antes de activar el flujo.", "bad");
          return;
        }

        const body = new FormData();
        body.append("data", file);
        submit.disabled = true;
        setStatus("Activando flujo...");
        setMessage("Enviando captura al backend y disparando n8n.");

        try {
          const response = await fetch("/activar-flujo", { method: "POST", body });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.detail || "El backend devolvio un error.");
          }
          paintPayload(payload);
          setStatus("Flujo completado");
        } catch (error) {
          setMessage(error.message, "bad");
          raw.textContent = JSON.stringify({ error: error.message }, null, 2);
          setStatus("Error");
        } finally {
          submit.disabled = false;
        }
      });

      directButton.addEventListener("click", async () => {
        const file = fileInput.files[0];
        if (!file) {
          setMessage("Selecciona una captura antes de procesar directo.", "bad");
          return;
        }

        const body = new FormData();
        body.append("data", file);
        directButton.disabled = true;
        setStatus("Procesando directo...");
        setMessage("Procesando con FastAPI sin pasar por n8n.");

        try {
          const response = await fetch("/procesar-directo", { method: "POST", body });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.detail || "El backend devolvio un error.");
          }
          paintPayload(payload);
          setStatus("Procesado directo");
        } catch (error) {
          setMessage(error.message, "bad");
          raw.textContent = JSON.stringify({ error: error.message }, null, 2);
          setStatus("Error");
        } finally {
          directButton.disabled = false;
        }
      });

      reportButton.addEventListener("click", async () => {
        setStatus("Consultando reporte...");
        try {
          const response = await fetch("/reporte");
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.detail || "No se pudo obtener reporte.");
          }
          raw.textContent = JSON.stringify(payload, null, 2);
          setMessage(`Total recaudado: S/. ${Number(payload.total_recaudado || 0).toFixed(2)}. Pagos: ${payload.cantidad_pagos || 0}.`, "ok");
          setStatus("Reporte listo");
        } catch (error) {
          setMessage(error.message, "bad");
          setStatus("Error");
        }
      });
    </script>
  </body>
</html>
